<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>قلب عاشق</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .heart {
      width: 100px;
      height: 90px;
      position: relative;
      transform: rotate(-45deg);
      animation: beat 1s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      width: 100px;
      height: 100px;
      background: red;
      border-radius: 50%;
      position: absolute;
    }

    .heart::before {
      top: -50px;
      left: 0;
    }

    .heart::after {
      left: 50px;
      top: 0;
    }

    @keyframes beat {
      0%, 20%, 40%, 60%, 80%, 100% {
        transform: rotate(-45deg) scale(1);
      }
      10%, 30%, 50%, 70%, 90% {
        transform: rotate(-45deg) scale(1.2);
      }
    }
  </style>
</head>
<body>
  <div class="heart"></div>
</body>
</html>
